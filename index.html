<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#FFD426" />
    <title>Pawprint – Describe a coin. Meet its mascot.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500;600&family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Some Solana packages read Node's `process` and `global`. Define them before any module runs.
      window.global = window.global || window;
      window.process = window.process || {
        env: {},
        browser: true,
        version: '',
        versions: {},
        nextTick: function (fn) {
          var args = Array.prototype.slice.call(arguments, 1);
          queueMicrotask(function () { fn.apply(null, args); });
        },
      };
    </script>
    <!-- If the app crashes while loading, show the error instead of a blank page. -->
    <script>
      function showCrash(msg) {
        var r = document.getElementById('root');
        if (r && !r.children.length) {
          r.innerHTML = '<pre style="padding:16px;margin:0;white-space:pre-wrap;font:13px monospace;color:#c00">App failed to start:\n' +
            String(msg).replace(/</g, '&lt;') + '\n\nOpen the browser console (F12) for details.</pre>';
        }
      }
      window.addEventListener('error', function (e) { showCrash(e.message || 'unknown error'); });
      window.addEventListener('unhandledrejection', function (e) { showCrash(e.reason && e.reason.message || e.reason); });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
